<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hayah Talent Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Paleta clara: fundo branco, azul como cor de ação, semáforo só para estado. Sempre no tema claro. */
  --ink:#15233b; --muted:#5b6880; --paper:#f7f9fc; --panel:#ffffff; --line:#e1e7f0; --line-strong:#c6d1e0;
  --accent:#1f62d6; --accent-ink:#ffffff; --accent-soft:#e9f1fe;
  --good:#2b7a4b; --good-soft:#e4f3ea; --warn:#a56a14; --warn-soft:#fbf1df; --bad:#b23b33; --bad-soft:#fbe7e5;
  --font-display:"Sora", "Segoe UI", system-ui, sans-serif;
  --font-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --radius:10px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tab-num,.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top-inner{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.brand{display:flex;flex-direction:column}
.brand small{color:var(--muted);font-size:.8rem}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
.spacer{flex:1}
nav.tabs button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
@media (max-width:899px){nav.tabs{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none}nav.tabs::-webkit-scrollbar{display:none}nav.tabs button svg{display:none}}
@media (min-width:900px){
  body.side #app{display:grid;grid-template-columns:240px minmax(0,1fr);align-items:start}
  body.side header.top{position:sticky;top:0;height:100vh;border-bottom:0;border-right:1px solid var(--line);overflow-y:auto}
  body.side .top-inner{height:100%;flex-direction:column;flex-wrap:nowrap;align-items:stretch;padding:20px 14px;gap:20px;max-width:none}
  body.side .brand{padding:0 8px 12px;border-bottom:1px solid var(--line)}
  body.side nav.tabs{flex-direction:column;flex-wrap:nowrap;gap:2px}
  body.side nav.tabs button{width:100%;text-align:left;padding:10px 12px;font-size:.95rem}
  body.side nav.tabs button[aria-current="page"]{box-shadow:inset 3px 0 0 var(--accent)}
  body.side .top-inner .seg{flex-direction:column;width:100%}
  body.side .top-inner .seg button{text-align:left;padding:8px 12px}
  body.side main{max-width:1240px;margin:0;width:100%}
  body.side footer{margin-left:240px;max-width:1240px}
}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
main{max-width:1240px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.banner{border:1px solid var(--line);background:var(--panel);border-left:4px solid var(--warn);padding:10px 14px;border-radius:8px;font-size:.92rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--panel);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.55;cursor:not-allowed}
label.field{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.92rem}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line-strong);background:var(--paper);border-radius:8px;padding:8px 10px;font-weight:400;width:100%}
textarea{min-height:110px;resize:vertical}
.chip{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.plain{background:transparent;border:1px solid var(--line-strong);color:var(--muted)}
.layout{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.pitem[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.pitem .nm{font-weight:700}
.report{display:flex;flex-direction:column;gap:16px}
.report-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:1000px){.grid3{grid-template-columns:1fr}}
.area{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.area.good{border-top:4px solid var(--accent)}
.area.bad{border-top:4px solid var(--bad)}
.area .pct{font-family:var(--font-display);font-size:1.6rem;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:#8db1ee;border-radius:4px}
.bar.g>i{background:var(--accent)} .bar.w>i{background:var(--warn)} .bar.b>i{background:var(--bad)}
.frow{display:grid;grid-template-columns:1fr 46px;gap:2px 8px;align-items:center;font-size:.9rem}
.frow .bar{grid-column:1/-1}
.traits{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.scale{position:relative;height:10px;background:linear-gradient(90deg,var(--line) 0 100%);border-radius:5px}
.scale>b{position:absolute;top:-3px;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);transform:translateX(-50%)}
.scale-labels{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
table.comp{width:100%;border-collapse:collapse;font-size:.92rem}
table.comp th,table.comp td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.comp th{font-size:.8rem;color:var(--muted);font-weight:600}
table.comp td.n{text-align:right;width:56px}
.tablewrap{overflow-x:auto}
.alert{border-radius:8px;padding:10px 12px;font-size:.92rem;background:var(--warn-soft);border-left:4px solid var(--warn)}
.alert.bad{background:var(--bad-soft);border-left-color:var(--bad)}
.qa{border-top:1px solid var(--line);padding-top:12px;display:grid;grid-template-columns:1fr 150px;gap:6px 16px}
.qa .ans{white-space:pre-wrap;background:var(--paper);border-radius:8px;padding:8px 10px;font-size:.93rem}
@media (max-width:640px){.qa{grid-template-columns:1fr}}
.empty{text-align:center;padding:40px 20px;display:flex;flex-direction:column;gap:12px;align-items:center}
.feedback{max-width:68ch;display:flex;flex-direction:column;gap:12px}
.feedback ul{margin:0;padding-left:20px}
/* teste */
.test{max-width:760px;margin:0 auto;width:100%}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent)}
.item{border-bottom:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:10px}
.item .q{font-weight:600}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.likert label{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line-strong);border-radius:8px;padding:8px 4px;cursor:pointer;text-align:center;font-size:.78rem;color:var(--muted);line-height:1.2}
.likert input{position:absolute;opacity:0;pointer-events:none}
.likert label b{font-size:1rem;color:var(--ink);font-family:var(--font-display)}
.likert input:checked+label{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.likert input:checked+label b{color:var(--accent-ink)}
.likert input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);font-weight:600}
details.dept{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
details.dept summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.dept .inner{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
/* etapa 2 */
.ed-row{display:grid;grid-template-columns:minmax(0,1fr) 92px auto auto;gap:8px;align-items:center}
@media (max-width:640px){.ed-row{grid-template-columns:1fr 80px;}.ed-row .btn{justify-self:start}}
.ed-w{display:flex;align-items:center;gap:4px;font-weight:600}
.ed-rows{display:flex;flex-direction:column;gap:8px}
.fcard{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.vlist{display:flex;flex-direction:column;gap:6px}
.layout>*,.grid2>*,.grid3>*{min-width:0}
@media (max-width:640px){header.top{position:static}.chip{white-space:normal}}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 20px}
.guide h4{margin:0;font-family:var(--font-display);font-size:.92rem;font-weight:600}
.guide ul{margin:0;padding-left:18px;font-size:.92rem}
table.heat td.n{min-width:52px}
.hm-g{background:var(--good-soft);color:var(--good)} .hm-w{background:var(--warn-soft);color:var(--warn)} .hm-b{background:var(--bad-soft);color:var(--bad)}
.scale.team{height:24px;background:linear-gradient(var(--line),var(--line)) 0 7px/100% 10px no-repeat}
.scale.team .dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);transform:translateX(-50%);opacity:.85}
.brandbar{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--accent);padding-bottom:10px;margin-bottom:6px}
.brandbar img{max-height:48px;max-width:180px}
.logoprev{border:1px dashed var(--line-strong);border-radius:8px;padding:10px;display:inline-block;background:#fff}.logoprev img{max-height:80px;max-width:260px;display:block}
.docprev{border:1px solid var(--line);border-radius:8px;padding:16px;background:#fff}
.alertrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:6px;background:var(--panel)}
.alertrow.alta{border-left-color:var(--bad)}.alertrow.media{border-left-color:var(--warn)}
.sinais{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.nb-wrap{display:flex;gap:8px;align-items:stretch}.nb-y{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.8rem;color:var(--muted);text-align:center}
.ninebox{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ninebox>*{min-width:0}.nb .btn{max-width:100%;white-space:normal;text-align:left}
.nb{min-height:92px;overflow:hidden;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;background:var(--paper);border:1px solid var(--line)}
.nb b{font-size:.8rem;color:var(--muted)}.nb .btn{font-size:.78rem;padding:3px 8px}
.nb.c22,.nb.c21,.nb.c12{background:var(--good-soft)}.nb.c00,.nb.c10{background:var(--bad-soft)}
.nb-x{text-align:center;font-size:.8rem;color:var(--muted);margin-left:22px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}
.feedback h3{margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2.wide{grid-template-columns:2fr 1fr}
@media (max-width:700px){.grid2,.grid2.wide{grid-template-columns:1fr}}
table.reflow td[data-label]:before{content:none}
@media (max-width:640px){table.reflow td[data-label]:before{content:attr(data-label) ": ";color:var(--muted)}}
.seg.small button{padding:4px 8px;font-size:.8rem;white-space:nowrap}
@media (max-width:640px){table.reflow thead{display:none}table.reflow tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}table.reflow td{display:block;border:0;padding:3px 0;text-align:left!important;width:auto!important}table.reflow td.n b:after{content:" de compatibilidade";font-weight:400;color:var(--muted)}}
.seg button[data-v="sim"][aria-pressed="true"]{background:var(--good);color:#fff}
.seg button[data-v="nao"][aria-pressed="true"]{background:var(--bad);color:#fff}
.big{font-family:var(--font-display);font-size:2rem;font-weight:700;line-height:1}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--accent-soft)}
tr[aria-current="true"] td{background:var(--accent-soft)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.kpi b{display:block;font-family:var(--font-display);font-size:1.5rem}
.sug{border-left:4px solid var(--line-strong);padding-left:10px}
.sug.realocar{border-left-color:var(--accent)} .sug.atencao{border-left-color:var(--bad)} .sug.manter{border-left-color:var(--good)} .sug.sem-funcao{border-left-color:var(--warn)}
footer{max-width:1240px;margin:0 auto;padding:8px 20px 32px;color:var(--muted);font-size:.82rem}
@media (prefers-reduced-motion:no-preference){.bar>i,.progress>i{transition:width .3s ease}}
</style>
</head>
<body>
<div id="app"></div>
<footer>Protótipo para uso pessoal e testes. Não é avaliação psicológica nem teste psicológico, e não deve ser usado para decidir contratações, demissões ou promoções.</footer>
<script>
/* Hayah Talent Intelligence — motor de cálculo (etapa 1)
   Fonte: documento "Sistema de Perfil e Alocação de Talentos", seções 2, 3, 3A, 3B e 3C. */

const TRAITS = ["H", "E", "X", "A", "C", "O"];
const TRAIT_NAMES = {
  H: "Honestidade-humildade", E: "Emocionalidade", X: "Extroversão",
  A: "Amabilidade", C: "Conscienciosidade", O: "Abertura a experiências"
};

/* 3C — 60 afirmações: [texto, traço, faceta, sentido] */
const ITEMS = [
  ["Não finjo ser mais do que sou.", "H", "Sinceridade", 1],
  ["Uso elogios para me dar bem.", "H", "Sinceridade", -1],
  ["Digo às pessoas o que elas querem ouvir para que façam o que eu quero.", "H", "Sinceridade", -1],
  ["Eu nunca pegaria algo que não é meu.", "H", "Justiça", 1],
  ["Devolvo o troco quando o caixa me dá a mais por engano.", "H", "Justiça", 1],
  ["Trapaceio para levar vantagem.", "H", "Justiça", -1],
  ["Não gostaria de ser uma celebridade famosa.", "H", "Desapego material", 1],
  ["Adoro luxo.", "H", "Desapego material", -1],
  ["Não me acho melhor do que as outras pessoas.", "H", "Modéstia", 1],
  ["Costumo me exibir quando tenho chance.", "H", "Modéstia", -1],
  ["Começo a entrar em pânico quando há perigo.", "E", "Medo", 1],
  ["Enfrento o perigo com confiança.", "E", "Medo", -1],
  ["Aceito correr riscos.", "E", "Medo", -1],
  ["Costumo me preocupar com as coisas.", "E", "Ansiedade", 1],
  ["Me estresso com facilidade.", "E", "Ansiedade", 1],
  ["Mantenho a calma sob pressão.", "E", "Ansiedade", -1],
  ["Preciso da aprovação dos outros.", "E", "Dependência", 1],
  ["Busco apoio nas outras pessoas.", "E", "Dependência", 1],
  ["Sinto as emoções dos outros.", "E", "Sentimentalismo", 1],
  ["Raramente me emociono.", "E", "Sentimentalismo", -1],
  ["Tenho capacidade de liderança.", "X", "Ousadia social", 1],
  ["Me saio bem quando preciso falar de improviso.", "X", "Ousadia social", 1],
  ["Prefiro ficar em segundo plano.", "X", "Ousadia social", -1],
  ["Faço amizade com facilidade.", "X", "Sociabilidade", 1],
  ["Não gostaria de um trabalho com muito contato com pessoas.", "X", "Sociabilidade", -1],
  ["Mantenho as pessoas à distância.", "X", "Sociabilidade", -1],
  ["Falo bastante.", "X", "Expressividade", 1],
  ["Não gosto de chamar atenção para mim.", "X", "Expressividade", -1],
  ["Geralmente tenho muita energia e disposição.", "X", "Vitalidade", 1],
  ["Me canso rápido.", "X", "Vitalidade", -1],
  ["Tenho facilidade para perdoar.", "A", "Perdão", 1],
  ["Guardo rancor.", "A", "Perdão", -1],
  ["Aceito as pessoas como elas são.", "A", "Gentileza", 1],
  ["Julgo os outros rapidamente.", "A", "Gentileza", -1],
  ["Me adapto com facilidade.", "A", "Flexibilidade", 1],
  ["Sei aceitar conselhos.", "A", "Flexibilidade", 1],
  ["Não suporto que me contrariem.", "A", "Flexibilidade", -1],
  ["Geralmente sou uma pessoa paciente.", "A", "Paciência", 1],
  ["Me irrito com facilidade.", "A", "Paciência", -1],
  ["Perco o controle quando fico com raiva.", "A", "Paciência", -1],
  ["Gosto de ordem.", "C", "Organização", 1],
  ["Deixo minhas coisas espalhadas.", "C", "Organização", -1],
  ["Me dedico muito ao que faço.", "C", "Diligência", 1],
  ["Começo logo as tarefas, sem enrolar.", "C", "Diligência", 1],
  ["Faço só o mínimo necessário.", "C", "Diligência", -1],
  ["Presto atenção aos detalhes.", "C", "Perfeccionismo", 1],
  ["Presto pouca atenção aos detalhes.", "C", "Perfeccionismo", -1],
  ["Faço planos e cumpro.", "C", "Prudência", 1],
  ["Tomo decisões precipitadas.", "C", "Prudência", -1],
  ["Cometo erros por descuido.", "C", "Prudência", -1],
  ["Vejo beleza em coisas que os outros não percebem.", "O", "Apreciação estética", 1],
  ["Não gosto de arte.", "O", "Apreciação estética", -1],
  ["Me interesso por ciência.", "O", "Curiosidade intelectual", 1],
  ["Gosto de ler textos desafiadores.", "O", "Curiosidade intelectual", 1],
  ["Não costumo me aprofundar nos assuntos.", "O", "Curiosidade intelectual", -1],
  ["Adoro pensar em novas formas de fazer as coisas.", "O", "Criatividade", 1],
  ["Tenho muitas ideias.", "O", "Criatividade", 1],
  ["Tenho dificuldade de imaginar coisas.", "O", "Criatividade", -1],
  ["Sei que minhas ideias às vezes surpreendem as pessoas.", "O", "Não convencionalidade", 1],
  ["Prefiro que me vejam como alguém convencional.", "O", "Não convencionalidade", -1]
].map(([t, trait, facet, dir]) => ({ t, trait, facet, dir }));

/* Ordem na tela: rodízio entre os traços (1, 11, 21, 31, 41, 51, 2, 12...) */
const ITEM_ORDER = [];
for (let i = 0; i < 10; i++) for (let t = 0; t < 6; t++) ITEM_ORDER.push(t * 10 + i);

/* Pares de coerência (números 1 a 60) */
const COHERENCE_PAIRS = [[11, 12], [15, 16], [33, 34], [46, 47], [56, 58]];

/* 3A — competências calculadas a partir dos traços. Ei = E invertida (6 − E). */
const COMPS = {
  resiliencia:     { label: "Resiliência", w: { Ei: .6, C: .4 } },
  estabilidade:    { label: "Estabilidade emocional", w: { Ei: 1 } },
  disciplina:      { label: "Disciplina", w: { C: 1 } },
  organizacao:     { label: "Organização / planejamento", w: { C: .8, O: .2 } },
  detalhes:        { label: "Atenção a detalhes / segurança", w: { C: 1 } },
  pontualidade:    { label: "Pontualidade", w: { C: 1 } },
  integridade:     { label: "Integridade / discrição", w: { H: .8, C: .2 } },
  comunicacao:     { label: "Comunicação", w: { X: .6, O: .4 } },
  escrita:         { label: "Comunicação escrita", w: { O: .6, C: .4 } },

function parseLibrary(raw) {
  return raw.map(([dept, funcs]) => ({
    dept,
    funcs: funcs.map(([name, spec]) => ({
      name,
      comps: spec.split(";").map(s => {
        const m = s.trim().match(/^(.*?)\s+(\d+)(\s+C)?$/);
        if (!m) throw new Error("Competência mal formada: " + s + " (" + name + ")");
        const key = ALIAS[m[1].trim()];
        if (!key) throw new Error("Competência sem ligação na 3A: " + m[1] + " (" + name + ")");
        return { name: m[1].trim(), key, w: +m[2], crit: !!m[3] };
      })
    }))
  }));
}

/* Regras de cálculo (seção 2, decisões da etapa 1) */
const RULES = {
  wTraitsWithInterview: 0.6,   // sem amostra de trabalho: 60% traços + 40% entrevista
  wInterview: 0.4,
  criticalMin: 3,              // competência crítica abaixo de 3 → penalidade
  criticalPenalty: 10,         // pontos percentuais por competência crítica abaixo do mínimo
  ideal: 5                     // perfil ideal = 5 em todas as competências da função
};

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const round1 = v => Math.round(v * 10) / 10;

/* Notas dos traços (1 a 5) a partir das 60 respostas (1 a 5; null = sem resposta) */
function scoreTraits(answers) {
  const sum = {}, n = {};
  TRAITS.forEach(t => { sum[t] = 0; n[t] = 0; });
  ITEMS.forEach((it, i) => {
    const a = answers[i];
    if (a == null || !(a >= 1 && a <= 5)) return;
    sum[it.trait] += it.dir > 0 ? a : 6 - a;
    n[it.trait]++;
  });
  const out = {};
  TRAITS.forEach(t => { out[t] = n[t] ? sum[t] / n[t] : null; });
  return out;
}

function traitValue(traits, k) {
  return k === "Ei" ? 6 - traits.E : traits[k];
}

/* Notas de entrevista por competência: geral (10 perguntas) + específica da vaga (5 a 6 perguntas) */
function interviewMap(generalNotes, specificQs, specificNotes) {
  const m = {};
  const add = (k, s) => { if (s >= 1 && s <= 5) (m[k] = m[k] || []).push(s); };
  if (generalNotes) INTERVIEW.forEach((q, i) => q.comps.forEach(c => add(c, generalNotes[i])));
  if (specificQs && specificNotes) specificQs.forEach((q, i) => add(q.key, specificNotes[i]));
  return m;
}

/* Notas das competências (1 a 5): traços + entrevista quando avaliada.
   Conhecimento técnico não vem da personalidade: só entra quando a entrevista específica o avalia. */
function scoreCompetenciesFromMap(traits, ivMap) {
  const out = {};
  Object.entries(COMPS).forEach(([key, c]) => {
    const list = ivMap[key];
    const iv = list && list.length ? list.reduce((a, b) => a + b, 0) / list.length : null;
    if (!c.w) { out[key] = { value: iv, traits: null, interview: iv }; return; }
    let t = 0;
    Object.entries(c.w).forEach(([k, w]) => { t += w * traitValue(traits, k); });
    const value = iv == null ? t : RULES.wTraitsWithInterview * t + RULES.wInterview * iv;
    out[key] = { value, traits: t, interview: iv };
  });
  return out;
}
function scoreCompetencies(traits, interviewScores) {
  return scoreCompetenciesFromMap(traits, interviewMap(interviewScores));
}

/* Compatibilidade de uma função: 100% − distância ponderada até o ideal (5), com penalidade de crítica */
function scoreFunction(func, comps) {
  const byKey = {};
  func.comps.forEach(c => {
    const v = comps[c.key] && comps[c.key].value;
    if (v == null) return; // conhecimento técnico: não avaliado na etapa 1
    const e = byKey[c.key] || (byKey[c.key] = { key: c.key, names: [], w: 0, crit: false, value: v });
    e.names.push(c.name); e.w += c.w; e.crit = e.crit || c.crit;
  });
  const entries = Object.values(byKey);
  const wSum = entries.reduce((a, e) => a + e.w, 0);
  if (!wSum) return { pct: null, gaps: [], notEvaluated: true };
  const dist = entries.reduce((a, e) => a + e.w * (RULES.ideal - e.value), 0) / (wSum * (RULES.ideal - 1));
  const gaps = entries.filter(e => e.crit && e.value < RULES.criticalMin);
  const pct = clamp(100 * (1 - dist) - RULES.criticalPenalty * gaps.length, 0, 100);
  const skipped = func.comps.filter(c => comps[c.key] && comps[c.key].value == null).map(c => c.name);
  return { pct: Math.round(pct), gaps, entries, skipped };
}

const RISK_GROUPS = [
  ["risco de estresse", ["estabilidade", "resiliencia", "crise", "autoconfianca"]],
  ["risco de erro", ["detalhes", "disciplina", "organizacao", "pontualidade", "integridade", "analitica"]],
  ["risco de desgaste", ["extroversao", "relacionamento", "comunicacao", "persuasao", "cordialidade", "empatia", "conflitos", "equipe"]]
];
function riskLabel(key) {
  const g = RISK_GROUPS.find(([, keys]) => keys.includes(key));
  return g ? g[0] : "baixa aderência";
}

/* Departamentos: maior nota para recomendar, média para alertar */
function scoreDepartments(comps, lib) {
  return (lib || LIBRARY).map(d => {
    const funcs = d.funcs.map(f => ({ name: f.name, ...scoreFunction(f, comps) }));
    const vals = funcs.map(f => f.pct).filter(v => v != null);
    const best = Math.max(...vals);
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    // motivo do desencaixe: competências críticas mais fracas do departamento
    const crit = {};
    d.funcs.forEach(f => f.comps.forEach(c => {
      if (!c.crit) return;
      const v = comps[c.key] && comps[c.key].value;
      if (v == null) return;
      crit[c.key] = { key: c.key, label: COMPS[c.key].label, value: v };
    }));
    const weakest = Object.values(crit).sort((a, b) => a.value - b.value).slice(0, 2);
    const reasons = weakest.map(w => ({ ...w, risk: riskLabel(w.key) }));
    return { dept: d.dept, id: d.id, funcs, best: Math.round(best), avg: Math.round(avg), reasons };
  });
}

/* Alertas de qualidade das respostas */
function answerAlerts(answers) {
  const alerts = [];
  const contradictions = COHERENCE_PAIRS.filter(([a, b]) => answers[a - 1] >= 4 && answers[b - 1] >= 4);
  if (contradictions.length >= 2) {
    alerts.push({ code: "inconsistencia", text: "Concordou com os dois lados de " + contradictions.length + " pares de afirmações opostas (" + contradictions.map(p => p.join(" × ")).join(", ") + "). As respostas podem não refletir o perfil real." });
  }
  const answered = answers.filter(a => a >= 1 && a <= 5);
  if (answered.length) {
    const counts = [1, 2, 3, 4, 5].map(v => answered.filter(a => a === v).length);
    const top = Math.max(...counts);
    if (top / answered.length >= 0.7) {
      alerts.push({ code: "uniforme", text: "Usou a mesma resposta em " + Math.round(100 * top / answered.length) + "% das afirmações. Pode ter respondido sem ler." });
    }
    const extremes = answered.filter(a => a === 1 || a === 5).length;
    if (extremes / answered.length >= 0.85 && top / answered.length < 0.7) {
      alerts.push({ code: "extremos", text: "Respondeu quase tudo nos extremos (1 ou 5). Vale confirmar o perfil na entrevista." });
    }
  }
  if (answered.length < 60) alerts.push({ code: "incompleto", text: (60 - answered.length) + " afirmações ficaram sem resposta." });
  return alerts;
}

/* Análise completa de uma pessoa */
function analyze(answers, interviewScores, lib) {
  const traits = scoreTraits(answers);
  const comps = scoreCompetencies(traits, interviewScores);
  const depts = scoreDepartments(comps, lib).filter(d => d.funcs.some(f => f.pct != null));
  const top = [...depts].sort((a, b) => b.best - a.best || b.avg - a.avg).slice(0, 3);
  const topNames = new Set(top.map(d => d.dept));
  const bottom = [...depts].filter(d => !topNames.has(d.dept)).sort((a, b) => a.avg - b.avg || a.best - b.best).slice(0, 3);
  const compList = Object.entries(comps)
    .filter(([, c]) => c.value != null)
    .map(([key, c]) => ({ key, label: COMPS[key].label, ...c }))
    .sort((a, b) => b.value - a.value);
  const interviewDone = !!(interviewScores && interviewScores.some(s => s >= 1 && s <= 5));
  return { traits, comps, compList, depts, top, bottom, alerts: answerAlerts(answers), interviewDone };
}

/* 5 competências da vaga (críticas primeiro, depois peso) + conhecimento técnico */
function generateQuestions(profile, funcName) {
  const byKey = {};
  profile.forEach(c => {
    if (c.key === "tecnico" || !QBANK[c.key]) return;
    const e = byKey[c.key] || (byKey[c.key] = { key: c.key, w: 0, crit: false });
    e.w += +c.w || 0; e.crit = e.crit || !!c.crit;
  });
  const keys = Object.values(byKey).sort((a, b) => (b.crit - a.crit) || (b.w - a.w)).slice(0, RULES2.specificComps).map(e => e.key);
  // perfil com poucas competências: completa até 5 com competências gerais de trabalho
  ["feedback", "equipe", "organizacao", "comunicacao", "curiosidade"].forEach(k => { if (keys.length < 4 && !keys.includes(k)) keys.push(k); });
  return keys.map(k => ({ q: QBANK[k], key: k })).concat([{ q: techQuestion(funcName || "a função"), key: "tecnico" }]);
}

/* Biblioteca efetiva: a base com as edições do gestor + departamentos novos */
function slugify(s) {
  return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}
function deptFromDoc(d) {
  return { dept: d.dept, funcs: (d.funcs || []).map(f => ({ name: f.name, comps: (f.comps || []).filter(c => COMPS[c.key]).map(c => ({ key: c.key, w: +c.w, crit: !!c.crit, name: compName(c) })) })) };
}
function buildLibrary(docs) {
  docs = docs || {};
  const base = LIBRARY.map(d => {
    const id = "b-" + slugify(d.dept);
    return docs[id] ? { ...deptFromDoc(docs[id]), id, base: true, edited: true } : { ...d, id, base: true };
  });
  const custom = Object.keys(docs).filter(id => id.indexOf("c-") === 0)
    .sort((a, b) => (docs[a].criadoEm || 0) - (docs[b].criadoEm || 0))
    .map(id => ({ ...deptFromDoc(docs[id]), id, custom: true }));
  return base.concat(custom);
}
function findFunc(lib, deptId, funcName) {
  const d = lib.find(x => x.id === deptId);
  const f = d && d.funcs.find(x => x.name === funcName);
  return f ? { dept: d, func: f } : null;
}

/* Validação de um perfil de função e de um departamento */
function validateProfile(comps, label) {
  const e = [];
  if (comps.length < 3) e.push(label + ": use pelo menos 3 competências.");
  if (comps.some(c => !(+c.w > 0))) e.push(label + ": todo peso precisa ser maior que zero.");
  const sum = comps.reduce((a, c) => a + (+c.w || 0), 0);
  if (sum !== 100) e.push(label + ": os pesos somam " + sum + "%, e precisam somar 100%.");
  if (!comps.some(c => c.crit)) e.push(label + ": marque pelo menos uma competência como crítica.");
  if (!comps.some(c => c.key !== "tecnico")) e.push(label + ": inclua competências de comportamento, não só conhecimento técnico.");
  return e;
}
function validateDept(d, lib) {
  const e = [];
  const nome = (d.dept || "").trim();
  if (nome.length < 2) e.push("Dê um nome ao departamento.");
  if (lib && lib.some(x => x.id !== d.id && x.dept.toLowerCase() === nome.toLowerCase())) e.push("Já existe um departamento com esse nome.");
  if (d.funcs.length < 3) e.push("O departamento precisa de pelo menos 3 funções.");
  const names = new Set();
  d.funcs.forEach((f, i) => {
    const n = (f.name || "").trim();
    if (!n) e.push("A função " + (i + 1) + " está sem nome.");
    else if (names.has(n.toLowerCase())) e.push("Há duas funções chamadas " + n + ".");
    names.add(n.toLowerCase());
    e.push(...validateProfile(f.comps, n || "Função " + (i + 1)));
  });
  return e;
}

/* Compatibilidade de uma pessoa com uma vaga */
function scoreVaga(vaga, answers, generalNotes, cand) {
  const traits = scoreTraits(answers || []);
  const comps = scoreCompetenciesFromMap(traits, interviewMap(generalNotes, vaga.perguntas, cand && cand.notas));
  const fit = scoreFunction({ name: vaga.titulo, comps: (vaga.perfil || []).map(c => ({ ...c, w: +c.w, name: compName(c) })) }, comps);
  const pre = (vaga.prereqs || []).map((t, i) => cand && Array.isArray(cand.prereq) && cand.prereq[i] != null ? cand.prereq[i] : null);
  const des = (vaga.desejaveis || []).map((t, i) => !!(cand && Array.isArray(cand.desej) && cand.desej[i]));
  const bonus = Math.min(RULES2.desejavelMax, des.filter(Boolean).length * RULES2.desejavelBonus);
  const base = fit.pct;
  const final = base == null ? null : Math.round(clamp(base + bonus, 0, 100));
  const specificDone = !!(cand && Array.isArray(cand.notas) && cand.notas.some(n => n >= 1 && n <= 5));
  return {
    base, bonus, final, fit, comps, pre, des, specificDone,
    eliminado: pre.some(v => v === false),
    pendentes: pre.filter(v => v == null).length,
    gaps: fit.gaps || []
  };
}

/* Sugestão de reorganização de uma empresa.
   emps: [{ key, nome, answers, notas, atual: {deptId, func} | null, cands: {vagaId: candidatura} }] */
function reorganize(emps, vagas, lib) {
  const rows = emps.map(e => {
    const analysis = analyze(e.answers, e.notas, lib);
    const ff = e.atual ? findFunc(lib, e.atual.deptId, e.atual.func) : null;
    const cur = ff ? scoreFunction(ff.func, analysis.comps).pct : null;
    const vs = vagas.map(v => ({ vaga: v, s: scoreVaga(v, e.answers, e.notas, e.cands && e.cands[v.id]) }));
    return { e, analysis, atual: ff, atualInvalida: !!e.atual && !ff, cur, vs, move: null };
  });
  const pairs = [];
  rows.forEach((r, ri) => r.vs.forEach((x, vi) => {
    if (x.s.eliminado || x.s.final == null || x.s.final < RULES2.moveMin) return;
    if (r.cur != null && x.s.final < r.cur + RULES2.moveGain) return;
    pairs.push({ ri, vi, gain: x.s.final - (r.cur == null ? RULES2.moveMin : r.cur), score: x.s.final });
  }));
  pairs.sort((a, b) => b.gain - a.gain || b.score - a.score);
  const usedR = new Set(), usedV = new Set();
  pairs.forEach(p => {
    if (usedR.has(p.ri) || usedV.has(p.vi)) return;
    usedR.add(p.ri); usedV.add(p.vi);
    const x = rows[p.ri].vs[p.vi];
    rows[p.ri].move = { vaga: x.vaga, score: p.score, gain: rows[p.ri].cur == null ? null : p.score - rows[p.ri].cur, pendentes: x.s.pendentes };
  });
  rows.forEach(r => {
    r.status = r.move ? "realocar" : r.cur == null ? "sem-funcao" : r.cur < RULES2.lowFit ? "atencao" : "manter";
  });
  const vagasRows = vagas.map(v => {
    const r = rows.find(x => x.move && x.move.vaga === v);
    const best = rows.map(x => ({ r: x, s: x.vs.find(y => y.vaga === v).s })).filter(x => !x.s.eliminado && x.s.final != null)
      .sort((a, b) => b.s.final - a.s.final)[0] || null;
    return { vaga: v, interno: r || null, melhor: best };
  });
  return { rows, vagasRows };
}

  else if (sat === 3) f.push({ pts: 10, text: "Satisfação mediana (3 de 5).", acao: "Perguntar o que melhoraria o dia a dia e combinar uma mudança concreta." });

/* banco em memória para o modo demonstração (fora do Claude) */
function memDB() {
  const store = new Map(), subs = new Set();
  const clone = o => JSON.parse(JSON.stringify(o));
  const notify = () => setTimeout(() => subs.forEach(f => f()), 0);
  const snap = p => { const d = store.get(p); return { id: p.split("/").pop(), exists: !!d, data: () => d ? clone(d) : undefined, metadata: { fromCache: false, hasPendingWrites: false } }; };
  const newId = () => Math.random().toString(36).slice(2, 12);
  const docRef = p => ({ id: p.split("/").pop(), path: p,
    get: async () => snap(p),
    set: async d => { store.set(p, clone(d)); notify(); },
    update: async d => { if (!store.has(p)) throw { code: "invalid_argument" }; store.set(p, Object.assign(store.get(p), clone(d))); notify(); },
    delete: async () => { store.delete(p); notify(); },
    onSnapshot: next => { const f = () => next(snap(p)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); } });
  const qs = (col, ob) => {
    const depth = col.split("/").length + 1;
    let docs = [...store.keys()].filter(k => k.startsWith(col + "/") && k.split("/").length === depth).map(snap);
    if (ob) docs.sort((a, b) => { const x = a.data()[ob.f], y = b.data()[ob.f]; return (x > y ? 1 : x < y ? -1 : 0) * (ob.d === "desc" ? -1 : 1); });
    return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
  };
  const query = (col, ob) => ({ path: col,
    orderBy: (f, d) => query(col, { f, d }), where: () => query(col, ob), limit: () => query(col, ob),
    get: async () => qs(col, ob),
    onSnapshot: next => { const f = () => next(qs(col, ob)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
    doc: id => docRef(col + "/" + (id || newId())),
    add: async d => { const r = docRef(col + "/" + newId()); await r.set(d); return r; } });
  return { doc: docRef, collection: c => query(c, null) };
}

  };

    ? '<nav class="tabs" aria-label="Seções">' + tabs.map(([k, l]) => '<button data-act="tab:' + k + '"' + (tabSel === k ? ' aria-current="page"' : "") + '><svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[k] + "</svg>" + l + "</button>").join("") + "</nav>" : "";

function viewMain() {
  if (S.mode === "loading") return '<div class="card muted">Carregando…</div>';
  let top = "";
  if (S.demo) top += '<div class="banner">Modo demonstração: esta cópia está fora do Claude, então nada é salvo. Abra a página pelo Claude para guardar os dados.</div>';
  if (S.slow && !S.loaded) top += '<div class="banner">Os dados ainda não carregaram. A conexão pode estar lenta.</div>';
  if (S.dbError) top += '<div class="banner">' + esc(S.dbError) + "</div>";
  if (S.toast) top += '<div class="banner" role="status" style="border-left-color:var(--good)">' + esc(S.toast) + "</div>";
  if (S.copyFallback) top += '<div class="card stack"><p class="small">Não deu para copiar automaticamente. Selecione o texto abaixo e copie.</p><textarea id="copy-fallback" readonly>' + esc(S.copyFallback) + '</textarea><div><button class="btn" data-act="copy-close">Fechar</button></div></div>';
  if (S.test) return top + viewTest();
  if (S.as === "pessoa") return top + viewPessoa();
  if (S.tab === "aplicar") S.tab = "convites";
  if (S.tab === "resultados") return top + viewResultados();
  if (S.tab === "convites") return top + viewAplicar() + viewConvites();
  if (S.tab === "config") return top + (S.ed && S.ed.kind === "dept" ? viewDeptEditor() : viewConfig());
  if (S.tab === "painel") return top + viewPainel();
  if (S.tab === "vagas") return top + (S.ed && S.ed.kind === "vaga" ? viewVagaEditor() : viewVagas());
  if (S.tab === "reorg") return top + viewEquipes();
  return top + viewPessoas();
}

/* ----- aba Pessoas ----- */
function viewPessoas() {
  const list = people();
  if (!list.length) {
    return '<div class="card empty"><h2>Nenhuma pessoa avaliada ainda</h2><p class="muted" style="max-width:56ch">Aplique o teste em alguém nesta tela ou crie três pessoas de exemplo para ver como ficam os relatórios.</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="tab:aplicar">Aplicar teste</button><button class="btn" data-act="exemplos"' + (S.busy.ex ? " disabled" : "") + ">" + (S.busy.ex ? "Criando…" : "Criar 3 exemplos") + "</button></div></div>";
  }
  if (!S.sel || !list.find(p => p.key === S.sel)) S.sel = list[0].key;
  const items = list.map(p => {
    const av = S.avaliacoes[p.key] || {};
    const a = analysisOf(p);
    const chips = [];
    chips.push(a.interviewDone ? '<span class="chip good">Entrevista avaliada</span>' : '<span class="chip warn">Entrevista pendente</span>');
    if (av.devolutivaLiberada) chips.push('<span class="chip plain">Devolutiva liberada</span>');
    if (a.alerts.some(x => x.code !== "incompleto")) chips.push('<span class="chip bad">Alerta</span>');
    if (p.exemplo) chips.push('<span class="chip plain">Exemplo</span>');
    return '<button class="pitem" data-act="sel:' + p.key + '" aria-current="' + (p.key === S.sel) + '"><span class="nm">' + esc(p.nome) + '</span><span class="small muted">' + esc(p.empresaNome || "Sem empresa") + " · " + esc(TIPO[p.tipo] || "") + " · " + fDate(p.criadoEm) + '</span><span class="row" style="gap:4px">' + chips.join("") + "</span></button>";
  }).join("");
  const p = list.find(x => x.key === S.sel);
  return '<div class="layout"><div class="stack"><div class="row" style="justify-content:space-between"><h2>Pessoas</h2><span class="muted small num">' + list.length + '</span></div><div class="plist">' + items + '</div></div><div>' + viewReport(p) + "</div></div>";
}

function viewReport(p) {
  const a = analysisOf(p);
  const av = S.avaliacoes[p.key] || {};
  const conv = p.conviteCodigo ? S.convites.find(c => c.id === p.conviteCodigo) : null;
  let h = '<div class="report">';
  h += '<div class="card report-head"><div><h2>' + esc(p.nome) + '</h2><p class="muted small">' + esc(p.empresaNome || "Sem empresa") + " · " + esc(TIPO[p.tipo] || "") + " · " + (p.src === "a" ? "Aplicado pelo gestor" : "Respondeu pelo convite " + esc(p.conviteCodigo || "")) + " · " + fDate(p.criadoEm) + '</p></div><span class="chip plain">Relatório técnico do gestor · não compartilhar com a pessoa</span></div>';
  const alerts = [...a.alerts];
  if (conv && conv.menores) alerts.unshift({ code: "menores", text: "Pessoa de um grupo com menores de idade. Trate estes dados como sensíveis." });
  if (!a.interviewDone) alerts.push({ code: "pendente", text: "A entrevista ainda não foi avaliada. Por enquanto as notas usam só o teste de personalidade." });
  if (alerts.length) h += '<div class="stack">' + alerts.map(x => '<div class="alert' + (["inconsistencia", "uniforme", "desejavel", "rapido"].includes(x.code) ? " bad" : "") + '">' + esc(x.text) + "</div>").join("") + "</div>";

  h += '<section class="stack"><h3>Áreas recomendadas</h3><div class="grid3">' + a.top.map((d, i) => areaCard(d, "good", i + 1)).join("") + "</div></section>";
  h += '<section class="stack"><h3>Áreas não indicadas</h3><div class="grid3">' + a.bottom.map(d => areaCard(d, "bad")).join("") + "</div></section>";
  h += viewReportEtapa2(p, a);

  h += '<section class="card stack"><h3>Traços de personalidade (HEXACO, de 1 a 5)</h3><div class="traits">' + TRAITS.map(t => {
    const v = a.traits[t]; const left = v == null ? 0 : (v - 1) / 4 * 100;
    return '<div class="stack" style="gap:6px"><div class="row" style="justify-content:space-between"><span>' + TRAIT_NAMES[t] + '</span><b class="num">' + f1(v) + '</b></div><div class="scale"><b style="left:' + left + '%"></b></div><div class="scale-labels"><span>1</span><span>3</span><span>5</span></div></div>';
  }).join("") + "</div></section>";

  h += '<section class="card stack"><h3>Competências</h3><div class="tablewrap"><table class="comp"><thead><tr><th>Competência</th><th class="n">Teste</th><th class="n">Entrevista</th><th class="n">Nota</th><th style="width:30%"></th></tr></thead><tbody>' + a.compList.map(c =>
    "<tr><td>" + esc(c.label) + '</td><td class="n num">' + f1(c.traits) + '</td><td class="n num">' + f1(c.interview) + '</td><td class="n num"><b>' + f1(c.value) + '</b></td><td><div class="bar ' + barClass((c.value - 1) / 4 * 100) + '"><i style="width:' + ((c.value - 1) / 4 * 100) + '%"></i></div></td></tr>').join("") + "</tbody></table></div><p class=\"small muted\">Nota = 60% teste + 40% entrevista quando a entrevista mede a competência. Conhecimento técnico não é avaliado nesta etapa.</p></section>";

  h += viewGuide(p, a);
  h += viewReportFase3(p, a);
  if (S.downloads) h += '<section class="card row" style="justify-content:space-between"><div><h3>Relatório com a sua marca</h3><p class="small muted">Arquivo pronto para imprimir ou salvar em PDF, com logo, cores e contato da consultoria. Inclui áreas, traços, competências e o guia de gestão.</p></div>' + downloadBtn("baixar-rel:" + p.key, "Baixar relatório") + "</section>";
  h += viewInterview(p);
  h += viewFeedbackPanel(p, a, av);
  const delKey = "del:" + p.key;
  h += '<div class="row">' + (S.confirmDel === p.key
    ? '<span class="small">' + (p.src === "a" ? "Excluir esta avaliação de vez?" : "Arquivar esta avaliação? Ela sai da lista.") + '</span><button class="btn danger" data-act="' + delKey + '">Confirmar</button><button class="btn" data-act="del-cancel">Cancelar</button>'
    : '<button class="btn danger" data-act="ask' + delKey + '">' + (p.src === "a" ? "Excluir avaliação" : "Arquivar avaliação") + "</button>") + "</div>";
  return h + "</div>";
}

function areaCard(d, kind, rank) {
  const pct = kind === "good" ? d.best : d.avg;
  const funcs = d.funcs.map(f => '<div class="frow"><span>' + esc(f.name) + '</span><span class="num" style="text-align:right">' + (f.pct == null ? "–" : f.pct + "%") + '</span><div class="bar ' + barClass(f.pct) + '"><i style="width:' + (f.pct || 0) + '%"></i></div></div>').join("");
  const why = kind === "bad" && d.reasons.length ? '<p class="small"><b>Motivo:</b> ' + d.reasons.map(r => esc(r.label.toLowerCase()) + " " + f1(r.value) + " (" + esc(r.risk) + ")").join("; ") + "</p>" : "";
  const label = kind === "good" ? (rank + "º · maior nota entre as funções") : "média das funções";
  return '<div class="area ' + kind + '"><div class="row" style="justify-content:space-between;align-items:flex-start"><h3>' + esc(d.dept) + '</h3><span class="pct num">' + pct + '%</span></div><span class="small muted">' + label + "</span>" + funcs + why + "</div>";
}

/* ----- guia de gestão (fase 2) ----- */
function guideText(p, g) {
  return "Guia de gestão: " + p.nome + "\n(uso exclusivo do gestor da área)\n\n" +
    g.sections.map(s => s.title + "\n" + s.items.map(x => "- " + x).join("\n")).join("\n\n") +
    "\n\nAproveite os pontos fortes: " + g.fortes.join(", ") + ".\n\nPlano de desenvolvimento\n" + g.dev.map(d => "- " + d.label + ": " + d.acao).join("\n") +
    "\n\nOrientação baseada em tendências do perfil. Confirme com o que observar no dia a dia.";
}
function viewGuide(p, a) {
  const g = buildGuide(a);
  let h = '<section class="card stack"><div class="row" style="justify-content:space-between"><h3>Guia de gestão</h3><span class="chip plain">Para o gestor da área · não mostrar à pessoa</span></div>';
  h += '<p class="small muted">Como liderar esta pessoa, a partir dos traços e das competências. Use como ponto de partida e confirme com o que observar no dia a dia.</p>';
  h += '<div class="guide">' + g.sections.map(s => '<div class="stack" style="gap:4px"><h4>' + esc(s.title) + '</h4><ul>' + s.items.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>").join("") + "</div>";
  h += '<div class="guide"><div class="stack" style="gap:4px"><h4>Aproveite os pontos fortes</h4><p class="small">Dê tarefas que pedem ' + esc(g.fortes.map(x => x.toLowerCase()).join(", ")) + '.</p></div><div class="stack" style="gap:4px"><h4>Plano de desenvolvimento</h4><ul>' + g.dev.map(d => "<li><b>" + esc(d.label) + "</b> (" + f1(d.value) + "): " + esc(d.acao) + "</li>").join("") + "</ul></div></div>";
  h += '<div class="row"><button class="btn" data-act="copiar-guia:' + p.key + '">Copiar guia</button></div>';
  return h + "</section>";
}

function viewInterview(p) {
  const notas = notasOf(p.key);
  const av = S.avaliacoes[p.key] || {};
  const dirty = !!S.draft[p.key];
  const ans = p.entrevista || [];
  let h = '<section class="card stack"><div class="row" style="justify-content:space-between"><h3>Entrevista geral</h3><span class="small muted">' + (av.avaliadoEm ? "Avaliada " + (av.avaliadoPor === "ia" ? "pelo Claude" : "pelo gestor") + " em " + fDate(av.avaliadoEm) : "Ainda não avaliada") + "</span></div>";
  h += '<p class="small muted">Régua: 1 = sem exemplo real ou reação negativa · 3 = exemplo concreto com ação adequada · 5 = exemplo concreto, ação própria, resultado claro e aprendizado.</p>';
  INTERVIEW.forEach((q, i) => {
    const motivo = av.motivos && av.motivos[i] && !dirty ? '<p class="small muted">' + esc(av.motivos[i]) + "</p>" : "";
    h += '<div class="qa"><div class="stack" style="gap:6px"><b>' + (i + 1) + ". " + esc(q.q) + '</b><div class="ans">' + (ans[i] ? esc(ans[i]) : '<span class="muted">(em branco)</span>') + "</div>" + motivo + '</div><label class="field">Nota<select id="nota-' + p.key + "-" + i + '" data-nota="' + p.key + ":" + i + '"><option value="">–</option>' + [1, 2, 3, 4, 5].map(n => '<option value="' + n + '"' + (notas[i] === n ? " selected" : "") + ">" + n + "</option>").join("") + "</select></label></div>";
  });
  const canAI = !!S.sample && !S.demo;
  h += '<div class="row">' + (canAI ? '<button class="btn primary" data-act="ia:' + p.key + '"' + (S.busy["ia" + p.key] ? " disabled" : "") + ">" + (S.busy["ia" + p.key] ? "Avaliando… pode levar até um minuto" : "Avaliar respostas com o Claude") + "</button>" : "") +
    '<button class="btn" data-act="notas:' + p.key + '"' + (!dirty || S.busy["n" + p.key] ? " disabled" : "") + ">Salvar notas</button>" + (dirty ? '<button class="btn" data-act="notas-desfazer:' + p.key + '">Desfazer</button>' : "") + "</div>";
  if (S.aiErr[p.key]) h += '<p class="err small">' + esc(S.aiErr[p.key]) + "</p>";
  if (!canAI) h += '<p class="small muted">' + (S.demo ? "A avaliação automática funciona quando a página é aberta pelo Claude. Aqui, dê as notas à mão." : "A avaliação automática não está disponível nesta visualização. Dê as notas à mão.") + "</p>";
  return h + "</section>";
}

function feedbackText(p, fb) {
  return "Devolutiva de " + p.nome + "\n\n" + fb.intro + "\n\nSeu jeito de trabalhar\n" + fb.perfil.map(x => "- " + x).join("\n") +
    "\n\nSeus pontos fortes: " + fb.fortes.join(", ") + ".\nPontos para desenvolver: " + fb.desenvolver.join(", ") + ".\n\nÁreas em que seu perfil tende a render mais\n" +
    fb.areas.map((x, i) => (i + 1) + ". " + x.dept + " (por exemplo, " + x.funcao + ")").join("\n") +
    (fb.areas.some(x => x.formacao && x.formacao.length) ? "\n\nCaminhos de formação\n" + fb.areas.filter(x => x.formacao && x.formacao.length).map(x => "- " + x.dept + ": " + x.formacao.join("; ")).join("\n") : "") +
    (fb.cursos && fb.cursos.length ? "\n\nCursos para desenvolver: " + fb.cursos.join(", ") + "." : "") +
    "\n\nEste resultado é uma orientação, não um rótulo. Ele mostra tendências, e todo mundo pode desenvolver qualquer competência.";
}
function caminhosHTML(fb) {
  const ar = (fb.areas || []).filter(x => x.formacao && x.formacao.length);
  let h = "";
  if (ar.length) h += "<h3>Caminhos de formação</h3><ul>" + ar.map(x => "<li><b>" + esc(x.dept) + ":</b> " + esc(x.formacao.join("; ")) + "</li>").join("") + "</ul>";
  if (fb.cursos && fb.cursos.length) h += "<h3>Cursos para desenvolver</h3><p>Procure cursos de " + esc(fb.cursos.join(" e de ")) + ".</p>";
  return h;
}
function viewFeedbackHTML(fb, nome) {
  return '<div class="feedback"><p>' + esc(fb.intro) + '</p><h3>Seu jeito de trabalhar</h3><ul>' + fb.perfil.map(x => "<li>" + esc(x) + "</li>").join("") + '</ul><h3>Seus pontos fortes</h3><p>' + esc(fb.fortes.join(", ")) + '.</p><h3>Pontos para desenvolver</h3><p>' + esc(fb.desenvolver.join(", ")) + '.</p><h3>Áreas em que seu perfil tende a render mais</h3><ol style="margin:0;padding-left:20px">' + fb.areas.map(x => "<li>" + esc(x.dept) + ' <span class="muted">(por exemplo, ' + esc(x.funcao) + ")</span></li>").join("") + "</ol>" + caminhosHTML(fb) + '<p class="small muted">Este resultado é uma orientação, não um rótulo. Ele mostra tendências, e todo mundo pode desenvolver qualquer competência.</p></div>';
}

function viewFeedbackPanel(p, a, av) {
  const fb = buildFeedback(a, p.tipo);
  let h = '<section class="card stack"><div class="row" style="justify-content:space-between"><h3>Devolutiva da pessoa</h3>' + (av.devolutivaLiberada ? '<span class="chip good">Liberada em ' + fDate(av.liberadaEm) + "</span>" : '<span class="chip plain">Ainda não liberada</span>') + "</div>";
  h += '<p class="small muted">É isto que a pessoa vê. Não mostra as áreas não indicadas nem as notas.</p>' + brandHeader(S.marca) + viewFeedbackHTML(fb, p.nome);
  h += '<div class="row">';
  if (p.src === "r") h += '<button class="btn primary" data-act="liberar:' + p.key + '"' + (S.busy["l" + p.key] ? " disabled" : "") + ">" + (av.devolutivaLiberada ? "Atualizar devolutiva liberada" : "Liberar devolutiva para a pessoa") + "</button>";
  else h += '<button class="btn primary" data-act="liberar:' + p.key + '"' + (S.busy["l" + p.key] ? " disabled" : "") + ">" + (av.devolutivaLiberada ? "Marcar de novo como entregue" : "Marcar como entregue") + "</button>";
  h += '<button class="btn" data-act="copiar:' + p.key + '">Copiar texto da devolutiva</button>' + downloadBtn("baixar-dev:" + p.key, "Baixar devolutiva com a sua marca") + downloadBtn("cartao:" + p.key, "Baixar cartão para redes sociais") + '<button class="btn" data-act="copiar-post:' + p.key + '">Copiar texto para postar</button></div>';
  if (!a.interviewDone) h += '<p class="small muted">Dica: avalie a entrevista antes de liberar, para a devolutiva usar as notas completas.</p>';
  return h + "</section>";
}

/* ----- aba Empresas e convites ----- */
function viewConvites() {
  const emp = S.empresas.map(e => '<option value="' + e.id + '">' + esc(e.nome) + "</option>").join("");
  let h = '<div class="banner">No protótipo, o código de convite só funciona para pessoas da sua organização no Claude, com acesso de Contribuidor a esta página. Para pessoas de fora, use a aba Aplicar teste. Os convites por link para qualquer pessoa entram com a hospedagem profissional.</div>';
  h += '<div class="grid3" style="grid-template-columns:1fr 2fr">';
  h += '<div class="card stack"><h3>Empresas</h3><label class="field">Nome da empresa<input type="text" id="emp-nome" data-keep placeholder="Ex.: Transportadora Rio Sul"></label><div><button class="btn primary" data-act="empresa">Cadastrar empresa</button></div>' +
    (S.empresas.length ? '<div class="stack" style="gap:8px">' + S.empresas.map(e => '<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:8px"><b>' + esc(e.nome) + '</b><label class="row small" style="flex-wrap:nowrap">Reavaliar a cada <select id="rv-' + e.id + '" data-reaval="' + e.id + '" style="width:auto">' + [6, 12, 18, 24].map(m => '<option value="' + m + '"' + (((+e.reavalMeses) || RULES3.reavalMeses) === m ? " selected" : "") + ">" + m + " meses</option>").join("") + "</select></label></div>").join("") + "</div>" : '<p class="small muted">Nenhuma empresa cadastrada.</p>') + "</div>";
  h += '<div class="card stack"><h3>Novo convite</h3><div class="row" style="align-items:flex-end"><label class="field" style="flex:1;min-width:180px">Empresa<select id="cv-empresa" data-keep><option value="">Sem empresa</option>' + emp + '</select></label><label class="field" style="flex:1;min-width:180px">Tipo<select id="cv-tipo" data-keep><option value="avulso">Pessoa avulsa</option><option value="funcionario">Funcionário</option><option value="grupo">Grupo (palestra, turma)</option></select></label></div>' +
    '<label class="field">Identificação do convite<input type="text" id="cv-rotulo" data-keep placeholder="Ex.: Turma 3º ano, Escola Estadual Centro"></label>' +
    '<label class="row small" style="font-weight:600"><input type="checkbox" id="cv-menores" data-keep> O grupo inclui menores de idade</label>' +
    '<div class="alert small">Se o grupo tiver menores de idade, os dados são sensíveis. Confirme que você tem a autorização dos pais ou responsáveis, obtida pela escola ou na inscrição do evento.</div>' +
    '<label class="row small"><input type="checkbox" id="cv-autorizo" data-keep> Confirmo que tenho a autorização dos pais ou responsáveis (só para grupos com menores)</label>' +
    '<div><button class="btn primary" data-act="convite">Gerar código</button></div>' + (S.busy.cvErr ? '<p class="err small">' + esc(S.busy.cvErr) + "</p>" : "") + "</div></div>";
  h += '<div class="card stack"><h3>Convites</h3>' + (S.convites.length ? '<div class="tablewrap"><table class="comp"><thead><tr><th>Código</th><th>Identificação</th><th>Empresa</th><th>Tipo</th><th>Respostas</th><th>Situação</th><th></th></tr></thead><tbody>' +
    S.convites.map(c => {
      const n = S.respostas.filter(r => r.conviteCodigo === c.id).length;
      return '<tr><td><b class="num" style="font-family:var(--font-display);letter-spacing:.08em">' + esc(c.id) + "</b></td><td>" + esc(c.rotulo || "–") + (c.menores ? ' <span class="chip warn">Menores · autorização confirmada ' + fDate(c.autorizacaoEm) + "</span>" : "") + "</td><td>" + esc(c.empresaNome || "–") + "</td><td>" + esc(TIPO[c.tipo]) + '</td><td class="num">' + n + "</td><td>" + (c.ativo ? '<span class="chip good">Ativo</span>' : '<span class="chip plain">Encerrado</span>') + '</td><td><div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn small" data-act="copy-code:' + c.id + '">Copiar</button><button class="btn small" data-act="toggle:' + c.id + '">' + (c.ativo ? "Encerrar" : "Reabrir") + "</button></div></td></tr>";
    }).join("") + "</tbody></table></div>" : '<p class="small muted">Nenhum convite ainda.</p>') + "</div>";
  return h;
}

/* ===================== Etapa 2 — utilidades ===================== */
const fPct = v => v == null ? "–" : v + "%";
const edId = path => "ed-" + path.replace(/\./g, "-");
const candId = (vagaId, pkey) => vagaId + "__" + pkey;
const candData = c => c ? { prereq: c.prereq || [], desej: c.desej || [], notas: c.notas || [] } : null;
const linesOf = t => String(t || "").split("\n").map(x => x.trim()).filter(Boolean).slice(0, 10);
const copyComps = cs => cs.map(c => ({ key: c.key, name: compName(c), w: +c.w, crit: !!c.crit }));
function peopleByKey() { const m = {}; people().forEach(p => { m[p.key] = p; }); return m; }
function candsOf(vagaId) {
  const pk = peopleByKey();
  return Object.entries(S.cands).filter(([, c]) => c.vagaId === vagaId && pk[c.pessoaKey]).map(([id, c]) => ({ id, ...c, p: pk[c.pessoaKey] }));
}
function candMapFor(pkey) { const m = {}; Object.values(S.cands).forEach(c => { if (c.pessoaKey === pkey) m[c.vagaId] = c; }); return m; }
const vcache = new Map();
function vagaScoreOf(v, p, cand) {
  const notas = notasOf(p.key), cd = candData(cand);
  const sig = S.libVer + "|" + v.id + "|" + (v.atualizadoEm || v.criadoEm) + "|" + p.key + "|" + JSON.stringify(notas) + "|" + JSON.stringify(cd) + "|" + (p.respostas || []).join("");
  if (vcache.has(sig)) return vcache.get(sig);
  if (vcache.size > 3000) vcache.clear();
  const r = scoreVaga(v, p.respostas || [], notas, cd);
  vcache.set(sig, r);
  return r;
}
function compOptions(sel) {
  return Object.entries(COMPS).map(([k, c]) => '<option value="' + k + '"' + (k === sel ? " selected" : "") + ">" + esc(c.label) + (k === "tecnico" ? " (só pela entrevista específica)" : "") + "</option>").join("");
}
function funcOptions(selDeptId, selFunc, empty) {
  return (empty ? '<option value="">' + esc(empty) + "</option>" : "") + S.lib.map(d => '<optgroup label="' + esc(d.dept) + '">' + d.funcs.map(f => {
    const v = d.id + "|" + f.name;
    return '<option value="' + esc(v) + '"' + (d.id === selDeptId && f.name === selFunc ? " selected" : "") + ">" + esc(f.name) + "</option>";
  }).join("") + "</optgroup>").join("");
}
function getPath(o, path) { return path.split(".").reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, path, v) { const ks = path.split("."); const last = ks.pop(); const t = ks.reduce((a, k) => a[k], o); t[last] = v; }

function compRows(prefix, rows) {
  const sum = rows.reduce((a, c) => a + (+c.w || 0), 0);
  return '<div class="ed-rows">' + rows.map((c, i) => {
    const p = prefix + "." + i;
    return '<div class="ed-row"><select id="' + edId(p + ".key") + '" data-ed="' + p + '.key" aria-label="Competência">' + compOptions(c.key) + "</select>" +
      '<label class="ed-w"><input type="number" min="1" max="100" step="1" id="' + edId(p + ".w") + '" data-ed="' + p + '.w" data-sum="' + prefix + '" value="' + esc(c.w) + '" aria-label="Peso"><span>%</span></label>' +
      '<label class="row small" style="gap:4px;flex-wrap:nowrap"><input type="checkbox" id="' + edId(p + ".crit") + '" data-ed="' + p + '.crit"' + (c.crit ? " checked" : "") + "> crítica</label>" +
      '<button class="btn small" data-act="ed-delc:' + p + '">Remover</button></div>';
  }).join("") + '</div><div class="row" style="justify-content:space-between"><button class="btn small" data-act="ed-addc:' + prefix + '">Adicionar competência</button><span class="small num' + (sum === 100 ? "" : " err") + '" id="' + edId("sum." + prefix) + '">Soma dos pesos: ' + sum + "%</span></div>";
}
function updateSum(prefix) {
  const el = document.getElementById(edId("sum." + prefix)); if (!el || !S.ed) return;
  const sum = (getPath(S.ed, prefix) || []).reduce((a, c) => a + (+c.w || 0), 0);
  el.textContent = "Soma dos pesos: " + sum + "%"; el.classList.toggle("err", sum !== 100);
}
function edErrors() {
  return S.ed && S.ed.err && S.ed.err.length ? '<div class="alert bad" role="alert"><b>Confira antes de salvar:</b><ul style="margin:4px 0 0;padding-left:18px">' + S.ed.err.map(e => "<li>" + esc(e) + "</li>").join("") + "</ul></div>" : "";
}

/* ===================== Aba Vagas ===================== */
function viewVagas() {
  if (!S.vagas.length) {
    return '<div class="card empty"><h2>Nenhuma vaga cadastrada</h2><p class="muted" style="max-width:60ch">Cadastre uma vaga com pré-requisitos e pontos desejáveis. O sistema calcula a compatibilidade de cada pessoa avaliada, monta a entrevista específica e sugere candidatos internos.</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="vaga-nova">Nova vaga</button><button class="btn" data-act="vaga-exemplo"' + (S.busy.vex ? " disabled" : "") + ">" + (S.busy.vex ? "Criando…" : "Criar vaga de exemplo") + "</button></div></div>";
  }
  const v = S.vagas.find(x => x.id === S.vagaSel) || S.vagas[0];
  const items = S.vagas.map(x => {
    const n = candsOf(x.id).length;
    return '<button class="pitem" data-act="vsel:' + x.id + '" aria-current="' + (x.id === v.id) + '"><span class="nm">' + esc(x.titulo) + '</span><span class="small muted">' + esc(x.empresaNome || "Sem empresa") + " · " + esc(x.func || "") + '</span><span class="row" style="gap:4px">' +
      (x.status === "encerrada" ? '<span class="chip plain">Encerrada</span>' : '<span class="chip good">Aberta</span>') + '<span class="chip plain">' + n + (n === 1 ? " candidato" : " candidatos") + "</span></span></button>";
  }).join("");
  return '<div class="layout"><div class="stack"><div class="row" style="justify-content:space-between"><h2>Vagas</h2><button class="btn small primary" data-act="vaga-nova">Nova vaga</button></div><div class="plist">' + items + "</div></div><div>" + viewVagaDetail(v) + "</div></div>";
}

function viewVagaDetail(v) {
  const cs = candsOf(v.id).map(c => ({ ...c, s: vagaScoreOf(v, c.p, c) }));
  cs.sort((a, b) => (a.s.eliminado - b.s.eliminado) || ((b.s.final == null ? -1 : b.s.final) - (a.s.final == null ? -1 : a.s.final)));
  let h = '<div class="report">';
  h += '<div class="card report-head"><div><h2>' + esc(v.titulo) + '</h2><p class="muted small">' + esc(v.empresaNome || "Sem empresa") + " · perfil base: " + esc(v.deptNome || "") + " › " + esc(v.func || "") + " · criada em " + fDate(v.criadoEm) + '</p></div><div class="row">' +
    (v.status === "encerrada" ? '<span class="chip plain">Encerrada</span>' : '<span class="chip good">Aberta</span>') +
    '<button class="btn small" data-act="vaga-editar:' + v.id + '">Editar</button><button class="btn small" data-act="vaga-status:' + v.id + '">' + (v.status === "encerrada" ? "Reabrir" : "Encerrar") + "</button>" +
    (S.confirmDel === "v:" + v.id ? '<button class="btn small danger" data-act="vdel:' + v.id + '">Confirmar exclusão</button><button class="btn small" data-act="del-cancel">Cancelar</button>' : '<button class="btn small danger" data-act="askdel:v:' + v.id + '">Excluir</button>') + "</div></div>";

  h += '<div class="grid3">';
  h += '<div class="card stack"><h3>Perfil da vaga</h3><div class="row small" style="gap:6px">' + (v.perfil || []).map(c => '<span class="chip' + (c.crit ? " warn" : " plain") + '">' + esc(compName(c)) + " " + c.w + "%" + (c.crit ? " · crítica" : "") + "</span>").join("") + "</div></div>";
  h += '<div class="card stack"><h3>Pré-requisitos</h3><p class="small muted">Eliminatórios: quem não atende sai da disputa.</p>' + ((v.prereqs || []).length ? '<ul style="margin:0;padding-left:18px">' + v.prereqs.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>" : '<p class="small muted">Nenhum.</p>') + "</div>";
  h += '<div class="card stack"><h3>Pontos desejáveis</h3><p class="small muted">Cada um atendido soma ' + RULES2.desejavelBonus + " pontos, até " + RULES2.desejavelMax + ".</p>" + ((v.desejaveis || []).length ? '<ul style="margin:0;padding-left:18px">' + v.desejaveis.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>" : '<p class="small muted">Nenhum.</p>') + "</div>";
  h += "</div>";

  /* candidatos */
  h += '<section class="card stack"><div class="row" style="justify-content:space-between"><h3>Candidatos</h3><span class="small muted">Ordem: compatibilidade com a vaga, já com os pontos desejáveis</span></div>';
  if (!cs.length) h += '<p class="small muted">Nenhum candidato ainda. Adicione pessoas avaliadas pelas sugestões abaixo.</p>';
  else {
    const cmpIds = cmpList(v.id);
    h += '<div class="tablewrap"><table class="comp reflow"><thead><tr><th style="width:70px">Comparar</th><th>Pessoa</th><th class="n">Vaga</th><th>Críticas abaixo de 3</th><th>Pré-requisitos</th><th>Entrevista específica</th></tr></thead><tbody>' + cs.map((c, i) => {
      const s = c.s;
      const pre = s.eliminado ? '<span class="chip bad">Eliminado</span>' : s.pendentes ? '<span class="chip warn">' + s.pendentes + " a conferir</span>" : '<span class="chip good">Atende</span>';
      return '<tr class="clickable" data-act="csel:' + c.id + '" aria-current="' + (S.candSel === c.id) + '"><td data-label="Comparar"><input type="checkbox" id="cmp-' + c.id + '" data-cmp="' + v.id + "|" + c.id + '"' + (cmpIds.includes(c.id) ? " checked" : "") + ' aria-label="Comparar ' + esc(c.p.nome) + '"></td><td><b>' + (s.eliminado ? "" : (i + 1) + ". ") + esc(c.p.nome) + '</b><br><span class="small muted">' + esc(TIPO[c.p.tipo] || "") + "</span></td>" +
        '<td class="n num"><b>' + fPct(s.final) + "</b>" + (s.bonus ? '<br><span class="small muted">+' + s.bonus + "</span>" : "") + '</td><td class="small" data-label="Críticas abaixo de 3">' + (s.gaps.length ? s.gaps.map(g => esc(COMPS[g.key].label)).join(", ") : '<span class="muted">nenhuma</span>') + '</td><td data-label="Pré-requisitos">' + pre + '</td><td data-label="Entrevista específica">' +
        (s.specificDone ? '<span class="chip good">Avaliada</span>' : '<span class="chip warn">Pendente</span>') + "</td></tr>";
    }).join("") + "</tbody></table></div><p class=\"small muted\">Clique numa linha para ver o detalhe, conferir os requisitos e fazer a entrevista específica.</p>";
  }
  h += "</section>";
  if (cs.length >= 2) h += viewComparacao(v, cs);
  const sel = cs.find(c => c.id === S.candSel);
  if (sel) h += viewCandidato(v, sel);

  /* sugestões */
  const candKeys = new Set(cs.map(c => c.pessoaKey));
  const pool = people().filter(p => !candKeys.has(p.key) && (S.vagaScope === "todas" || !v.empresaId || p.tipo !== "funcionario" || p.empresaId === v.empresaId));
  const sug = pool.map(p => ({ p, s: vagaScoreOf(v, p, null) })).filter(x => x.s.final != null).sort((a, b) => b.s.final - a.s.final).slice(0, 8);
  h += '<section class="card stack"><div class="row" style="justify-content:space-between"><h3>Pessoas avaliadas com mais compatibilidade</h3><div class="seg small" role="group" aria-label="Quem considerar"><button data-act="vscope:empresa" aria-pressed="' + (S.vagaScope !== "todas") + '">Desta empresa e avulsos</button><button data-act="vscope:todas" aria-pressed="' + (S.vagaScope === "todas") + '">Todas</button></div></div>';
  if (!sug.length) h += '<p class="small muted">Nenhuma outra pessoa avaliada para comparar.</p>';
  else h += '<div class="tablewrap"><table class="comp reflow"><thead><tr><th>Pessoa</th><th>Origem</th><th class="n">Vaga</th><th>Críticas abaixo de 3</th><th></th></tr></thead><tbody>' + sug.map(x => {
    const origem = x.p.tipo === "funcionario" ? (x.p.empresaId && x.p.empresaId === v.empresaId ? "Funcionário desta empresa" : "Funcionário de " + (x.p.empresaNome || "outra empresa")) : "Pessoa avulsa";
    return "<tr><td><b>" + esc(x.p.nome) + '</b></td><td class="small">' + esc(origem) + '</td><td class="n num"><b>' + fPct(x.s.final) + '</b></td><td class="small" data-label="Críticas abaixo de 3">' + (x.s.gaps.length ? x.s.gaps.map(g => esc(COMPS[g.key].label)).join(", ") : '<span class="muted">nenhuma</span>') +
      '</td><td><button class="btn small" data-act="addcand:' + v.id + "|" + x.p.key + '">Adicionar como candidato</button></td></tr>';
  }).join("") + "</tbody></table></div>";
  h += '<p class="small muted">Antes da entrevista específica, a nota usa o teste e a entrevista geral. Os pré-requisitos são conferidos depois que a pessoa vira candidata.</p></section>';
  return h + "</div>";
}

/* ----- comparação de candidatos lado a lado (fase 2) ----- */
function cmpList(vid) {
  if (S.cmpSel[vid]) return S.cmpSel[vid].filter(id => S.cands[id]);
  const v = S.vagas.find(x => x.id === vid); if (!v) return [];
  return candsOf(vid).map(c => ({ id: c.id, s: vagaScoreOf(v, c.p, c) }))
    .sort((a, b) => (a.s.eliminado - b.s.eliminado) || ((b.s.final || 0) - (a.s.final || 0))).slice(0, 3).map(x => x.id);
}
const ALERT_SHORT = { inconsistencia: "Respostas contraditórias", uniforme: "Respostas quase todas iguais", extremos: "Quase tudo nos extremos", incompleto: "Teste incompleto",
  desejavel: "Perfil favorável demais", divergencia: "Teste e entrevista divergem", rapido: "Respondeu rápido demais" };
function viewComparacao(v, cs) {
  const ids = cmpList(v.id);
  const sel = ids.map(id => cs.find(c => c.id === id)).filter(Boolean);
  let h = '<section class="card stack"><div class="row" style="justify-content:space-between"><h3>Comparação lado a lado</h3><span class="small muted">Marque até 4 candidatos na coluna Comparar</span></div>';
  if (sel.length < 2) return h + '<p class="small muted">Marque pelo menos 2 candidatos para comparar.</p></section>';
  const best = (vals, hi) => { const ok = vals.filter(x => x != null); if (ok.length < 2) return -1; const m = Math.max(...ok); return ok.filter(x => x === m).length === 1 && hi(m) ? vals.indexOf(m) : -1; };
  const row = (label, cells, sub, bi) => "<tr><td>" + label + (sub ? '<br><span class="small muted">' + sub + "</span>" : "") + "</td>" + cells.map((c, i) => '<td class="' + (i === bi ? "hm-g" : "") + '">' + c + "</td>").join("") + "</tr>";
  const finals = sel.map(c => c.s.eliminado ? null : c.s.final);
  let t = '<div class="tablewrap"><table class="comp cmp"><thead><tr><th></th>' + sel.map(c => "<th>" + esc(c.p.nome) + '<br><span class="small muted" style="font-weight:400">' + esc(TIPO[c.p.tipo] || "") + "</span></th>").join("") + "</tr></thead><tbody>";
  t += row("<b>Compatibilidade final</b>", sel.map(c => '<b class="num">' + fPct(c.s.final) + "</b>" + (c.s.eliminado ? ' <span class="chip bad">Eliminado</span>' : "")), "", best(finals, () => true));
  t += row("Perfil da vaga", sel.map(c => '<span class="num">' + fPct(c.s.base) + "</span>"));
  t += row("Pontos desejáveis", sel.map(c => '<span class="num">+' + c.s.bonus + "</span> " + '<span class="small muted">(' + c.s.des.filter(Boolean).length + " de " + c.s.des.length + ")</span>"));
  t += row("Pré-requisitos", sel.map(c => c.s.eliminado ? '<span class="chip bad">Não atende</span>' : c.s.pendentes ? '<span class="chip warn">' + c.s.pendentes + " a conferir</span>" : '<span class="chip good">Atende</span>'));
  t += row("Entrevista específica", sel.map(c => c.s.specificDone ? '<span class="chip good">Avaliada</span>' : '<span class="chip warn">Pendente</span>'));
  const entries = (sel[0].s.fit.entries || []).slice().sort((a, b) => b.w - a.w);
  t += '<tr><td colspan="' + (sel.length + 1) + '"><b>Competências da vaga</b></td></tr>';
  entries.forEach(e => {
    const vals = sel.map(c => { const x = (c.s.fit.entries || []).find(y => y.key === e.key); return x ? x.value : null; });
    t += row(esc(COMPS[e.key].label) + (e.crit ? ' <span class="chip warn">crítica</span>' : ""), vals.map(x => '<span class="num' + (x != null && e.crit && x < RULES.criticalMin ? " err" : "") + '">' + f1(x) + "</span>"), "peso " + e.w + "%", best(vals.map(x => x == null ? null : Math.round(x * 10) / 10), () => true));
  });
  t += row("Críticas abaixo de 3", sel.map(c => c.s.gaps.length ? '<span class="small">' + c.s.gaps.map(g => esc(COMPS[g.key].label)).join(", ") + "</span>" : '<span class="small muted">nenhuma</span>'));
  t += row("Alertas das respostas", sel.map(c => { const al = analysisOf(c.p).alerts; return al.length ? '<span class="small">' + al.map(x => esc(ALERT_SHORT[x.code] || x.code)).join(", ") + "</span>" : '<span class="small muted">nenhum</span>'; }));
  t += row("Pontos fortes gerais", sel.map(c => '<span class="small">' + esc(analysisOf(c.p).compList.slice(0, 3).map(x => x.label).join(", ")) + "</span>"));
  t += "</tbody></table></div>";
  return h + t + '<p class="small muted">Em verde, o melhor valor da linha quando só um candidato chega a ele. A decisão é do gestor: use a comparação junto com a entrevista e as referências.</p></section>';
}

function viewCandidato(v, c) {
  const d = S.cdraft[c.id];
  const notas = d ? d.notas : (c.notas || []);
  const resp = d ? d.respostas : (c.respostas || []);
  const s = vagaScoreOf(v, c.p, { ...c, notas });
  let h = '<section class="card stack" id="cand-detalhe" style="border-color:var(--accent)">';
  h += '<div class="report-head"><div><h3>' + esc(c.p.nome) + ' · candidato à vaga</h3><p class="small muted">Perfil da vaga ' + fPct(s.base) + (s.bonus ? " + " + s.bonus + " pontos desejáveis" : "") + ' = compatibilidade final</p></div><span class="big num">' + fPct(s.final) + "</span></div>";
  const al = [];
  if (s.eliminado) al.push('<div class="alert bad">Não atende ao pré-requisito: ' + esc((v.prereqs || []).filter((x, i) => s.pre[i] === false).join("; ")) + ". Fica fora da disputa.</div>");
  else if (s.pendentes) al.push('<div class="alert">' + s.pendentes + (s.pendentes === 1 ? " pré-requisito ainda precisa" : " pré-requisitos ainda precisam") + " ser conferido" + (s.pendentes === 1 ? "." : "s.") + "</div>");
  if (s.gaps.length) al.push('<div class="alert bad">Competência crítica abaixo de 3: ' + s.gaps.map(g => esc(COMPS[g.key].label) + " " + f1(g.value)).join(", ") + ". Cada uma tira " + RULES.criticalPenalty + " pontos.</div>");
  if (!s.specificDone) al.push('<div class="alert">A entrevista específica ainda não foi avaliada.</div>');
  h += al.join("");

  h += '<div class="grid2">';
  h += '<div class="stack"><h3>Pré-requisitos</h3>' + ((v.prereqs || []).length ? v.prereqs.map((x, i) => {
    const val = s.pre[i];
    return '<div class="stack" style="gap:4px"><span class="small">' + esc(x) + '</span><div><div class="seg small" role="group" aria-label="' + esc(x) + '">' +
      '<button data-v="sim" data-act="pre:' + c.id + "|" + i + '|sim" aria-pressed="' + (val === true) + '">Atende</button><button data-v="nao" data-act="pre:' + c.id + "|" + i + '|nao" aria-pressed="' + (val === false) + '">Não atende</button><button data-act="pre:' + c.id + "|" + i + '|x" aria-pressed="' + (val == null) + '">A conferir</button></div></div></div>';
  }).join("") : '<p class="small muted">A vaga não tem pré-requisitos.</p>') + "</div>";
  h += '<div class="stack"><h3>Pontos desejáveis</h3>' + ((v.desejaveis || []).length ? v.desejaveis.map((x, i) =>
    '<label class="row small" style="flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="des-' + c.id + "-" + i + '" data-des="' + c.id + "|" + i + '"' + (s.des[i] ? " checked" : "") + "> <span>" + esc(x) + "</span></label>").join("") : '<p class="small muted">A vaga não tem pontos desejáveis.</p>') + "</div>";
  h += "</div>";

  const entries = (s.fit.entries || []).slice().sort((a, b) => b.w - a.w);
  h += '<div class="stack"><h3>Competências da vaga</h3><div class="tablewrap"><table class="comp"><thead><tr><th>Competência</th><th class="n">Peso</th><th class="n">Teste</th><th class="n">Entrevista</th><th class="n">Nota</th><th style="width:24%"></th></tr></thead><tbody>' + entries.map(e => {
    const cc = s.comps[e.key];
    return "<tr><td>" + esc(COMPS[e.key].label) + (e.crit ? ' <span class="chip warn">crítica</span>' : "") + '</td><td class="n num">' + e.w + '%</td><td class="n num">' + f1(cc.traits) + '</td><td class="n num">' + f1(cc.interview) + '</td><td class="n num"><b>' + f1(e.value) + '</b></td><td><div class="bar ' + barClass((e.value - 1) / 4 * 100) + '"><i style="width:' + ((e.value - 1) / 4 * 100) + '%"></i></div></td></tr>';
  }).join("") + "</tbody></table></div>" + (s.fit.skipped && s.fit.skipped.length ? '<p class="small muted">Ainda fora do cálculo: ' + esc(s.fit.skipped.join(", ")) + ". Entra quando a pergunta de conhecimento técnico for avaliada.</p>" : "") + "</div>";

  h += '<div class="stack"><div class="row" style="justify-content:space-between"><h3>Entrevista específica</h3><span class="small muted">' + (c.avaliadoEm ? "Avaliada " + (c.avaliadoPor === "ia" ? "pelo Claude" : "pelo gestor") + " em " + fDate(c.avaliadoEm) : "Ainda não avaliada") + "</span></div>";
  h += '<p class="small muted">Ao vivo: anote um resumo do que a pessoa disse e dê a nota. Pelo sistema: a pessoa escreve as respostas aqui e você pede a avaliação ao Claude, que olha só o conteúdo. Régua de 1 a 5, a mesma da entrevista geral.</p>';
  (v.perguntas || []).forEach((q, i) => {
    const mot = !d && c.motivos && c.motivos[i] ? '<p class="small muted">' + esc(c.motivos[i]) + "</p>" : "";
    h += '<div class="qa"><div class="stack" style="gap:6px"><b>' + (i + 1) + ". " + esc(q.q) + ' <span class="chip plain">' + esc(COMPS[q.key] ? COMPS[q.key].label : q.key) + '</span></b><textarea id="cr-' + c.id + "-" + i + '" data-cr="' + c.id + "|" + i + '" placeholder="Resposta ou resumo da resposta">' + esc(resp[i] || "") + "</textarea>" + mot +
      '</div><label class="field">Nota<select id="cn-' + c.id + "-" + i + '" data-cn="' + c.id + "|" + i + '"><option value="">–</option>' + [1, 2, 3, 4, 5].map(n => '<option value="' + n + '"' + (notas[i] === n ? " selected" : "") + ">" + n + "</option>").join("") + "</select></label></div>";
  });
  const canAI = !!S.sample && !S.demo;
  h += '<div class="row"><button class="btn primary" data-act="cand-salvar:' + c.id + '"' + (S.busy["cs" + c.id] ? " disabled" : "") + ">Salvar entrevista</button>" +
    (canAI ? '<button class="btn" data-act="cand-ia:' + c.id + '"' + (S.busy["ci" + c.id] ? " disabled" : "") + ">" + (S.busy["ci" + c.id] ? "Avaliando… pode levar até um minuto" : "Avaliar respostas com o Claude") + "</button>" : "") +
    (d ? '<button class="btn" data-act="cand-desfazer:' + c.id + '">Desfazer</button>' : "") + "</div>";
  if (S.aiErr[c.id]) h += '<p class="err small">' + esc(S.aiErr[c.id]) + "</p>";
  if (!canAI) h += '<p class="small muted">' + (S.demo ? "A avaliação automática funciona quando a página é aberta pelo Claude. Aqui, dê as notas à mão." : "A avaliação automática não está disponível nesta visualização. Dê as notas à mão.") + "</p>";
  h += "</div>";
  h += '<div class="row">' + (S.confirmDel === "c:" + c.id ? '<span class="small">Tirar esta pessoa da vaga? A entrevista específica é apagada.</span><button class="btn danger" data-act="cand-del:' + c.id + '">Confirmar</button><button class="btn" data-act="del-cancel">Cancelar</button>'
    : '<button class="btn danger" data-act="askdel:c:' + c.id + '">Tirar da vaga</button>') + "</div>";
  return h + "</section>";
}
